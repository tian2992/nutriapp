{% extends 'anthrocalc/base.html' %}
{% load crispy_forms_tags %}
{% load i18n %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h3 class="card-title mb-0">{% if object %}{% translate "Editar Comunidad" %}{% else %}{% translate "Nueva Comunidad" %}{% endif %}</h3>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="mt-3 d-flex justify-content-between">
                        <a href="{% url 'communities:list' %}" class="btn btn-secondary">{% translate "Cancelar" %}</a>
                        <button type="submit" class="btn btn-primary">{% translate "Guardar" %}</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
