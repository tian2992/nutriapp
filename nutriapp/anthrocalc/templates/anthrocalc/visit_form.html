{% extends 'anthrocalc/base.html' %}
{% block content %}
{% load crispy_forms_tags %}
{% load i18n %}
<form method="post">
    {% csrf_token %}
    {{ form|crispy }}

    {% if visit.id %}
    <a href='{% url "metrics:new" %}?visit={{visit.id}}'>{% translate "Agregar medición" %}</a>
    {% endif %}
    <input type="submit" value="{% translate "Submit" %}" />
</form>
{% endblock %}
