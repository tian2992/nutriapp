{% extends 'anthrocalc/base.html' %}
{% load i18n %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-danger">
            <div class="card-header bg-danger text-white">
                <h3 class="card-title mb-0">{% translate "Confirmar eliminación" %}</h3>
            </div>
            <div class="card-body">
                <p>{% blocktranslate with name=object.name %}¿Está seguro de que desea eliminar la comunidad <strong>{{ name }}</strong>?{% endblocktranslate %}</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-between">
                        <a href="{% url 'communities:list' %}" class="btn btn-secondary">{% translate "Cancelar" %}</a>
                        <button type="submit" class="btn btn-danger">{% translate "Eliminar definitivamente" %}</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
