## Configuracion minima de Nutriaccion
services:
  web:
    build: .
    ports:
      - "8000"
    env_file:
      - .env
#    environment:
#      - DATABASE_URL=postgres://nutriuser:nutripass@db:5432/nutridb
#      - SECRET_KEY=your-secret-key
#      - DEBUG=False
#      - ALLOWED_HOSTS=localhost,127.0.0.1
#      - CSRF_TRUSTED_ORIGINS=http://localhost:8000,http://127.0.0.1:8000
    volumes:
      - ./static:/app/static
      - ./media:/app/media
    depends_on:
      db:
        condition: service_healthy

  db:
   image: postgres:16-alpine
   env_file:
     - .env
   volumes:
     - nutri_postgres_data:/var/lib/postgresql/data
   # One-off `docker compose run web ...` commands (migrate, bulk loads) wait
   # for this instead of racing Postgres start-up.
   healthcheck:
     test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER:-postgres}\" -d \"$${POSTGRES_DB:-postgres}\""]
     interval: 5s
     timeout: 5s
     retries: 12

volumes:
  nutri_postgres_data: